serenity {
  project.name = "Bon-Bonite | Juan Vanegas | DEMO o exploración pública"
  take.screenshots = FOR_EACH_ACTION
  outputDirectory = "target/site/serenity"
}
webdriver {
  driver = chrome
  autodownload = true
  timeouts.implicitlywait = 0
  wait.for.timeout = 15000
  capabilities {
    "goog:chromeOptions" {
      args = ["--headless=new", "--window-size=1440,1000", "--disable-notifications"]
    }
  }
}
